[project]
name = "listmonk-rss"
version = "0.1.0"
description = "Provide an RSS integration for listmonk, a self-hosted newsletter and mailing list manager"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "beautifulsoup4>=4.13.3",
    "click>=8.1.8",
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "jinja2>=3.1.5",
    "python-dotenv>=1.0.1",
    "markdownify>=0.14.1",
    "duckdb>=1.1.0",
]
